<!DOCTYPE html>

<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "inverse-on-surface": "#eef0ff", "surface-container": "#eaedff", "on-background": "#131b2e", "on-primary-container": "#a3faef", "on-tertiary": "#ffffff", "surface-tint": "#006a63", "surface-bright": "#faf8ff", "outline": "#6e7977", "on-secondary-fixed": "#121e1c", "error": "#ba1a1a", "background": "#faf8ff", "surface": "#faf8ff", "error-container": "#ffdad6", "on-secondary-container": "#5b6765", "primary-fixed": "#9cf2e8", "surface-container-high": "#e2e7ff", "secondary-fixed": "#d8e5e2", "secondary-fixed-dim": "#bcc9c6", "tertiary-fixed-dim": "#ffb598", "on-primary-fixed-variant": "#00504a", "surface-variant": "#dae2fd", "inverse-surface": "#283044", "on-error": "#ffffff", "on-secondary": "#ffffff", "surface-container-lowest": "#ffffff", "on-primary-fixed": "#00201d", "tertiary-fixed": "#ffdbce", "on-tertiary-container": "#ffe5db", "primary-fixed-dim": "#80d5cb", "surface-dim": "#d2d9f4", "on-error-container": "#93000a", "inverse-primary": "#80d5cb", "tertiary": "#7f4025", "outline-variant": "#bdc9c6", "primary": "#005c55", "primary-container": "#0f766e", "on-primary": "#ffffff", "secondary-container": "#d8e5e2", "on-surface-variant": "#3e4947", "surface-container-highest": "#dae2fd", "on-tertiary-fixed": "#370e00", "tertiary-container": "#9c573a", "secondary": "#55615f", "on-surface": "#131b2e", "on-tertiary-fixed-variant": "#72361b", "surface-container-low": "#f2f3ff", "on-secondary-fixed-variant": "#3d4947" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin-sm": "1rem", "space-xs": "0.25rem", "margin": "1.25rem", "space-xl": "2rem", "space-md": "1rem", "gutter-sm": "0.75rem", "space-lg": "1.5rem", "gutter": "1rem", "space-sm": "0.5rem" }, fontFamily: { "headline-lg": ["Inter"], "headline-sm": ["Inter"], "body-md": ["Inter"], "label-sm": ["Inter"], "display-currency-mobile": ["Inter"], "body-sm": ["Inter"], "headline-md": ["Inter"], "display-currency": ["Inter"], "body-lg": ["Inter"], "label-md": ["Inter"] }, fontSize: { "headline-lg": ["24px", { lineHeight: "30px", letterSpacing: "-0.02em", fontWeight: "700" }], "headline-sm": ["16px", { lineHeight: "22px", letterSpacing: "-0.01em", fontWeight: "600" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "label-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.03em", fontWeight: "600" }], "display-currency-mobile": ["32px", { lineHeight: "36px", letterSpacing: "-0.03em", fontWeight: "700" }], "body-sm": ["13px", { lineHeight: "18px", fontWeight: "400" }], "headline-md": ["20px", { lineHeight: "26px", letterSpacing: "-0.015em", fontWeight: "600" }], "display-currency": ["36px", { lineHeight: "40px", letterSpacing: "-0.03em", fontWeight: "700" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "label-md": ["13px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "600" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full max-w-[480px] mx-auto px-margin pb-space-xl">
<!-- Brand & Greeting Header -->
<div class="flex flex-col items-center text-center mt-space-md mb-space-xl">
<div class="relative flex items-center justify-center w-16 h-16 rounded-2xl bg-surface-container mb-space-md shadow-sm">
<div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-on-primary shadow-sm">
<span class="material-symbols-outlined text-[26px]">account_balance_wallet</span>
</div>
<div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-[12px] text-on-primary-fixed">verified_user</span>
</div>
</div>
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-primary font-label-sm text-label-sm mb-space-xs">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
      Banca Digital Segura • Ecuador
    </div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">
      Bienvenido a Nexo
    </h1>
<p class="font-body-md text-body-md text-secondary mt-1">
      Tu banca digital transparente y sin fricción
    </p>
</div>
<!-- Authentication Form Card -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-space-lg shadow-sm flex flex-col gap-space-md">
<!-- Email Input Field -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface" for="email">
        Correo electrónico
      </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-[20px] text-secondary pointer-events-none">
          mail
        </span>
<input autocomplete="email" class="w-full h-[52px] pl-11 pr-4 bg-surface-container-low rounded-2xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_rgba(15,118,110,0.25)] transition-all" id="email" placeholder="ejemplo@correo.ec" type="email" value="andres.vallejo@correo.ec"/>
</div>
</div>
<!-- Password Input Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">
          Contraseña
        </label>
<button class="font-label-sm text-label-sm text-primary hover:underline" type="button">
          ¿Olvidaste tu contraseña?
        </button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-[20px] text-secondary pointer-events-none">
          lock
        </span>
<input autocomplete="current-password" class="w-full h-[52px] pl-11 pr-12 bg-surface-container-low rounded-2xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_rgba(15,118,110,0.25)] transition-all" id="password" placeholder="••••••••••••" type="password" value="MiClaveSegura2025"/>
<button aria-label="Alternar visibilidad de contraseña" class="absolute right-3 w-8 h-8 rounded-full flex items-center justify-center text-secondary hover:text-on-surface transition-colors" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordEyeIcon">
            visibility
          </span>
</button>
</div>
</div>
<!-- Primary CTA: Log in -->
<button class="w-full h-[52px] mt-1 bg-primary text-on-primary font-headline-sm text-headline-sm rounded-2xl shadow-sm hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-2" id="submitLogin" type="button">
<span>Iniciar sesión</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<!-- Divider -->
<div class="relative flex items-center justify-center my-1">
<div class="w-full h-px bg-surface-container-high"></div>
<span class="absolute px-3 bg-surface-container-lowest font-label-sm text-label-sm text-secondary uppercase tracking-wider">
        o también
      </span>
</div>
<!-- Biometric Authentication Option -->
<button class="w-full h-[52px] rounded-2xl bg-surface-container text-primary font-headline-sm text-headline-sm active:scale-[0.99] transition-all flex items-center justify-center gap-2.5" id="biometricBtn" type="button">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">
        fingerprint
      </span>
<span>Ingresar con biometría</span>
<span class="material-symbols-outlined text-[18px] text-secondary">
        face
      </span>
</button>
</div>
<!-- Onboarding Link -->
<div class="w-full text-center mt-space-lg mb-space-md">
<p class="font-body-md text-body-md text-secondary">
      ¿No tienes cuenta?
      <a class="font-headline-sm text-headline-sm text-primary underline underline-offset-4 ml-1" href="javascript:void(0)">
        Abre tu cuenta en 3 minutos
      </a>
</p>
</div>
<!-- Regulatory Assurance Badge -->
<div class="flex items-center justify-center gap-2 px-space-md py-2.5 rounded-full bg-surface-container-low mx-auto">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">
      verified
    </span>
<span class="font-label-sm text-label-sm text-on-surface-variant">
      Regulado por la Superintendencia de Bancos
    </span>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('passwordEyeIcon');
    const biometricBtn = document.getElementById('biometricBtn');
    const submitLogin = document.getElementById('submitLogin');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (biometricBtn) {
      biometricBtn.addEventListener('click', () => {
        biometricBtn.classList.add('bg-primary-fixed');
        setTimeout(() => {
          biometricBtn.classList.remove('bg-primary-fixed');
        }, 300);
      });
    }

    if (submitLogin) {
      submitLogin.addEventListener('click', () => {
        submitLogin.style.transform = 'scale(0.98)';
        setTimeout(() => {
          submitLogin.style.transform = '';
        }, 150);
      });
    }
  })();
</script></main></body></html>
