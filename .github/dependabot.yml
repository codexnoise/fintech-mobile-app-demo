# Actualizaciones de dependencias (OWASP M2 · supply chain). PRs semanales y agrupadas.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      flutter:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /backend/functions
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      backend:
        patterns: ["*"]
    ignore:
      # TS 7 elimina moduleResolution=node10 (migración de tsconfig aparte).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Los tipos deben seguir el runtime de Cloud Functions (Node 22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
