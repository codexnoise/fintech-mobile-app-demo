name: Release

# Se dispara al crear un tag vX.Y.Z sobre main (release desde trunk).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK (release, ofuscado)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
      - run: dart pub get
      - name: Build APK (obfuscated + split debug info)
        working-directory: apps/mobile
        run: |
          flutter build apk --release -t lib/main_prod.dart \
            --dart-define-from-file=env/prod.example.json \
            --obfuscate --split-debug-info=build/symbols \
            --build-name=${GITHUB_REF_NAME#v}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

  deploy-firebase:
    name: Deploy Functions · Rules · Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requiere los secrets FIREBASE_SERVICE_ACCOUNT (JSON) y FIREBASE_PROJECT_ID.
    if: ${{ vars.ENABLE_FIREBASE_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix backend/functions
      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase-tools@latest deploy --only functions,firestore,hosting \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive --force
